name: CI — Go Tests, PostGIS Integration & Frontend Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Go Unit + PostGIS & Redis Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: commute
          POSTGRES_PASSWORD: commute_dev
          POSTGRES_DB: bangkok_commute
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U commute -d bangkok_commute"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://commute:commute_dev@localhost:5432/bangkok_commute?sslmode=disable
      REDIS_ADDR: localhost:6379
      REQUIRE_DB_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Validate curated transit dataset
        working-directory: backend
        run: go run ./cmd/seed --validate-only

      - name: Run migrations & seed PostGIS (1st pass)
        working-directory: backend
        run: go run ./cmd/seed

      - name: Verify seed idempotency (2nd pass)
        working-directory: backend
        run: go run ./cmd/seed

      - name: Run unit + PostGIS/Redis integration tests with race detector
        working-directory: backend
        run: go test -v -race -count=1 ./...

      - name: Build Go binaries
        working-directory: backend
        run: go build ./...

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check & Vite build
        working-directory: frontend
        run: npm run build
