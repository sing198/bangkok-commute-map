name: Monthly Thai Rental Price Sync (RentHub + PropertyHub)

on:
  schedule:
    # 1st of every month at 02:00 UTC (09:00 Bangkok time)
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-portal-prices:
    name: Sync RentHub & PropertyHub Prices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Sync real building and station rent prices (RentHub + PropertyHub)
        run: python3 scripts/sync_thai_portal_prices.py --workers 6 --delay 0.15

      - name: Verify Go dataset and unit tests
        working-directory: backend
        run: go test -count=1 ./cmd/seed ./internal/commute ./internal/transit

      - name: Commit and push updated prices if changed
        run: |
          if git diff --quiet backend/data/portal_prices.json; then
            echo "No portal price changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/portal_prices.json
          git commit -m "chore(data): refresh real RentHub and PropertyHub rental prices"
          git push
