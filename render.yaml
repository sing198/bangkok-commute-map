services:
  - type: web
    name: bangkok-commute-map-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GIN_MODE
        value: release
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        sync: false # Set to Neon or Supabase PostGIS connection string
      - key: REDIS_URL
        sync: false # Optional: Set to Upstash rediss:// URL (gracefully degrades if omitted)
      - key: CORS_ALLOW_ORIGIN
        sync: false # Set to your Vercel frontend URL, e.g. https://bangkok-commute-map.vercel.app
